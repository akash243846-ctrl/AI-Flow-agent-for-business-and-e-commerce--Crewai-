version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentflow-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini/gemini-3.5-flash}
      - DATABASE_URL=sqlite:////app/agentflow.db
    volumes:
      - ./outputs:/app/outputs
      - ./agentflow.db:/app/agentflow.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentflow-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
