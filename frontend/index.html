<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />

    <title>AgentFlow AI - Multi-Agent Business & E-Commerce Strategy Studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: "#0f1321",
              "surface-dim": "#0f1321",

              "inverse-on-surface": "#2c303f",
              outline: "#849495",
              "outline-variant": "#3b494b",
              "surface-tint": "#00dbe9",
              primary: "#dbfcff",
              "on-primary": "#00363a",
              "primary-container": "#00f0ff",
              "on-primary-container": "#006970",
              secondary: "#ddb7ff",
              "on-secondary": "#490080",
              "secondary-container": "#6f00be",
              "on-secondary-container": "#d6a9ff",

              "error-container": "#93000a",

              cyan: {
                300: "#67e8f9",

              indigo: {
                300: "#a5b4fc",
                400: "#818cf8",
                500: "#6366f1"

            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              "2xl": "1rem",
              full: "9999px"
            },
            fontFamily: {
              sans: ["Inter", "-apple-system", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"]
            }
          }
        }
      };

    <style>
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #090e1c;
      }
      ::-webkit-scrollbar-thumb {
        background: #252939;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3b494b;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
    </style>
  </head>
  <body class="bg-surface font-sans text-on-surface antialiased selection:bg-primary-container/20 selection:text-primary-container overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
